---
site_name: "LTROPS-2623 Build a Network Agent in Cisco Cloud Control That Troubleshoots Anything While You Sleep"
site_description: "LTROPS-2623 Build a Network Agent in Cisco Cloud Control That Troubleshoots Anything While You Sleep"
site_author: "Cisco"
copyright: Copyright &copy; 2027 Cisco. Cisco Live EMEA 2027 instructor-led lab. Lab environment content is fictitious (PseudoCo).

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: template_assets/cisco_logo.png
  favicon: template_assets/cisco_logo.png

extra:
  generator: false
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/seatcard.js

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: fade
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: false
      skip_classes:
        - custom-skip-class-name
      auto_caption: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.keys
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Lab:
      - Introduction: introduction.md
      - Before you start: setup.md
      - "Part 1 - Test your prompt in AI Canvas":
          - part1/index.md
          - "1.1 Orientation": part1/1-1-orientation.md
          - "1.2 Multi-domain diagnosis": part1/1-2-diagnose.md
          - "1.3 Make it yours: Lab Tools": part1/1-3-lab-tools.md
          - "2.1 Save the triage method": part1/2-1-save.md
      - "Part 2 - Build an agent that runs it":
          - part2/index.md
          - "3.1 Shape the agent": part2/3-1-shape-agent.md
          - "3.2 Sandbox test": part2/3-2-test-publish.md
          - "3.3 Build your custom workflow": part2/3-3-custom-workflow.md
          - "3.4 Wire it in and choose how it runs": part2/3-4-wire-schedule.md
          - "3.5 Lights Out": part2/3-5-lights-out.md
          - "3.6 Your business": part2/3-6-your-business.md
  - Reference:
      - reference/tools.md
      - reference/output-contract.md
      - reference/evidence.md
      - reference/stretch.md
      - reference/troubleshooting.md
