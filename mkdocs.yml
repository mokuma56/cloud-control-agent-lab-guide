site_name: Build a Network Agent in Cisco Cloud Control
site_description: >-
  Cisco Live EMEA 2027 lab guide - build a network agent in Cisco Cloud Control that
  troubleshoots anything while you sleep.
copyright: Lab guide for Cisco Live EMEA 2027. Lab environment content is fictitious (PseudoCo).

theme:
  name: material
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle: {icon: material/weather-sunny, name: Light mode}
  icon:
    logo: material/robot-outline

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
  - pymdownx.keys
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Welcome: index.md
  - Before you start: setup.md
  - "Part 1 - Test your prompt in AI Canvas":
      - part1/index.md
      - "1.1 Orientation": part1/1-1-orientation.md
      - "1.2 Multi-domain diagnosis": part1/1-2-diagnose.md
      - "1.3 Make it yours: Lab Tools": part1/1-3-lab-tools.md
      - "2.1 Save the combined result": part1/2-1-save.md
  - "Part 2 - Build an agent that runs it":
      - part2/index.md
      - "3.1 Shape the agent": part2/3-1-shape-agent.md
      - "3.2 Sandbox test and publish": part2/3-2-test-publish.md
      - "3.3 Build your custom workflow": part2/3-3-custom-workflow.md
      - "3.4 Wire it in and choose how it runs": part2/3-4-wire-schedule.md
      - "3.5 Lights Out": part2/3-5-lights-out.md
      - "3.6 Your business": part2/3-6-your-business.md
  - Reference:
      - reference/tools.md
      - reference/output-contract.md
      - reference/evidence.md
      - reference/stretch.md
      - reference/troubleshooting.md
